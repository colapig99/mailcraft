name: Prepare legacy LDAP branch

on:
  push:
    branches: [feature/exchange-legacy-ldap]
    paths:
      - '.github/workflows/ldap-prepare.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/exchange-legacy-ldap
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: rustfmt
      - name: Regenerate Cargo lockfile
        run: cargo generate-lockfile
      - name: Rust format
        run: cargo fmt --all
      - name: Commit changes to feature branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/
          if ! git diff --cached --quiet; then
            git commit -m "chore(ldap): format dedicated credential and directory changes"
            git push origin HEAD:feature/exchange-legacy-ldap
          fi
