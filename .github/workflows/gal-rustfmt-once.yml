name: Format GAL search fixes
# Reformat debounce and missing GAL diagnostics
on:
  push:
    branches: [feature/exchange-legacy-ldap]
    paths: ['.github/workflows/gal-rustfmt-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/exchange-legacy-ldap
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/
          if ! git diff --cached --quiet; then
            git commit -m "style(gal): rustfmt directory alias and source-status fixes"
            git push origin HEAD:feature/exchange-legacy-ldap
          fi
