name: Legacy Exchange Windows test build
# Performance POC: persistent signed/sealed LDAP worker, indexed and historical alias search
on:
  push:
    branches: [feature/exchange-legacy-ldap, fix/sender-name-gal-fallback, diagnostic/imap-sync-access-denied, fix/skip-denied-public-folder-sync, feature/manual-public-folder-selection]
    paths:
      - '.github/workflows/ldap-windows-build.yml'
      - 'crates/engine/src/session/pim/directory.rs'
      - 'crates/ui-egui/src/panes/list.rs'
      - 'crates/net/src/ldap.rs'
      - 'crates/net/src/ldap_windows.ps1'
      - 'crates/engine/src/session/mailboxes.rs'
      - 'crates/net/src/sync.rs'
      - 'crates/net/src/worker/sync.rs'
      - 'crates/net/src/worker.rs'
      - 'crates/engine/src/session/prefs.rs'
      - 'crates/engine/src/cmd/navigation.rs'
      - 'crates/ui-egui/src/panes/nav.rs'
      - 'crates/engine/src/session/pim.rs'
      - 'crates/engine/src/cmd/pim.rs'
      - 'crates/model/src/contacts.rs'
      - 'crates/model/src/addr.rs'
      - 'crates/engine/src/tests/calendar/pim.rs'
      - 'crates/ui-egui/src/dialogs/ldap.rs'
      - 'crates/ui-egui/src/reading/compose.rs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-test-app:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Build unsigned Windows POC executable
        run: cargo build --locked --release -p mailcraft
      - name: Collect test binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ldap-poc | Out-Null
          Copy-Item target/release/mailcraft.exe ldap-poc/mailcraft.exe
          @"
          INTERNAL TEST ONLY. Unsigned experimental MailCraft fork.
          LDAP Windows Integrated uses your Windows domain logon.
          Never test first with a domain administrator account.
          Do not distribute as an official MailCraft release.
          "@ | Set-Content ldap-poc/README.txt
      - uses: actions/upload-artifact@v5
        with:
          name: mailcraft-legacy-ldap-windows-poc-${{ github.run_number }}
          path: ldap-poc/
          retention-days: 7
