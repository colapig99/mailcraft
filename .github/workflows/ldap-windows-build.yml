name: Legacy Exchange Windows test build
# Performance POC: persistent signed/sealed LDAP worker, indexed and historical alias search
on:
  push:
    branches: [feature/exchange-legacy-ldap, fix/sender-name-gal-fallback, diagnostic/imap-sync-access-denied, fix/skip-denied-public-folder-sync, feature/manual-public-folder-selection, fix/account-scoped-store-locks, feature/public-folder-settings-panel, fix/public-folder-ui-safety, fix/public-folder-tree-and-lock-test, feature/rss-feeds-visibility, feature/html-table-rendering]
    paths:
      - '.github/workflows/ldap-windows-build.yml'
      - 'crates/mime/src/layout.rs'
      - 'crates/mime/src/layout/node.rs'
      - 'crates/mime/src/layout/blocks.rs'
      - 'crates/ui-egui/src/reading/body/table.rs'
      - 'crates/ui-egui/src/reading/body.rs'
      - 'crates/ui-egui/src/reading/body/table/tests.rs'
      - 'crates/mime/src/layout/tests.rs'
      - 'crates/engine/src/session/pim/directory.rs'
      - 'crates/ui-egui/src/panes/list.rs'
      - 'crates/net/src/ldap.rs'
      - 'crates/net/src/ldap_windows.ps1'
      - 'crates/engine/src/session/mailboxes.rs'
      - 'crates/net/src/sync.rs'
      - 'crates/net/src/worker/sync.rs'
      - 'crates/net/src/worker.rs'
      - 'crates/engine/src/session/prefs.rs'
      - 'crates/engine/src/cmd/navigation.rs'
      - 'crates/ui-egui/src/panes/nav.rs'
      - 'crates/store/src/lib.rs'
      - 'crates/store/src/marking.rs'
      - 'crates/store/src/folders.rs'
      - 'crates/store/src/bodies.rs'
      - 'crates/store/src/merging.rs'
      - 'crates/engine/src/session/mailboxes.rs'
      - 'crates/ui-egui/src/dialogs/accounts.rs'
      - 'crates/ui-egui/src/dialogs.rs'
      - 'crates/engine/src/cmd/accounts.rs'
      - 'crates/engine/src/cmd/navigation.rs'
      - 'crates/engine/src/session/pim.rs'
      - 'crates/engine/src/cmd/pim.rs'
      - 'crates/model/src/contacts.rs'
      - 'crates/model/src/addr.rs'
      - 'crates/engine/src/tests/calendar/pim.rs'
      - 'crates/ui-egui/src/dialogs/ldap.rs'
      - 'crates/ui-egui/src/reading/compose.rs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-test-app:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Test HTML Excel table border regression
        run: cargo test --locked -p mailcraft-mime excel_css_cell_borders_survive_layout
      - name: Test Word table empty spacer cells
        run: cargo test --locked -p mailcraft-mime word_report_keeps_empty_spacer_cells
      - name: Test shared Word table column tracks
        run: cargo test --locked -p mailcraft-ui-egui word_report_colspan_and_ranking_share_one_grid
      - name: Build unsigned Windows POC executable
        run: cargo build --locked --release -p mailcraft
      - name: Collect test binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ldap-poc | Out-Null
          Copy-Item target/release/mailcraft.exe ldap-poc/mailcraft.exe
          @"
          INTERNAL TEST ONLY. Unsigned experimental MailCraft fork.
          LDAP Windows Integrated uses your Windows domain logon.
          Never test first with a domain administrator account.
          Do not distribute as an official MailCraft release.
          "@ | Set-Content ldap-poc/README.txt
      - uses: actions/upload-artifact@v5
        with:
          name: mailcraft-legacy-ldap-windows-poc-${{ github.run_number }}
          path: ldap-poc/
          retention-days: 7
