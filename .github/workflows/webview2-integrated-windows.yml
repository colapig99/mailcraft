name: MailCraft WebView2 preview integration (Windows)
on:
  push:
    branches: [feature/html-webview2-integration]
    paths:
      - 'apps/mailcraft/**'
      - 'crates/ui-egui/**'
      - 'poc/webview2/**'
      - '.github/workflows/webview2-integrated-windows.yml'
  workflow_dispatch:
permissions:
  contents: read

# Do not spend two Windows runners building superseded preview commits.
concurrency:
  group: webview2-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fastest path to a *testable* pair of executables: independent of UI tests.
  # An uploaded pair is not automatically an accepted/stable release.
  windows-exes:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Compile MailCraft Windows EXE
        run: cargo build --release -p mailcraft
      - name: Test WebView2 HTML sandbox and live mode
        run: cargo test --manifest-path poc/webview2/Cargo.toml
      - name: Compile Windows WebView2 helper
        run: cargo build --manifest-path poc/webview2/Cargo.toml --release
      - name: Stage both EXEs side by side
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/mailcraft.exe dist/
          Copy-Item poc/webview2/target/release/mailcraft-webview2-poc.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: mailcraft-webview2-integration-windows
          path: dist/*
          if-no-files-found: error

  # UI regression is kept as an independent gate rather than delaying the artifact.
  ui-regression:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Test native egui UI without changing its renderer
        run: cargo test -p mailcraft-ui-egui --lib
