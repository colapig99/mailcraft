name: Format persistent GAL changes
on:
  push:
    branches: [feature/exchange-legacy-ldap]
    paths: ['.github/workflows/gal-perf-format-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/exchange-legacy-ldap
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: rustfmt
      - name: Use latest feature branch revision
        run: |
          git fetch origin feature/exchange-legacy-ldap
          git checkout -B feature/exchange-legacy-ldap origin/feature/exchange-legacy-ldap
      - run: cargo fmt --all
      - name: Commit formatting only on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/
          if ! git diff --cached --quiet; then
            git commit -m "style(gal): format persistent LDAP session and indexed search"
            git push origin HEAD:feature/exchange-legacy-ldap
          fi
