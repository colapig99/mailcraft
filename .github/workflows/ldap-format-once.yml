name: Format legacy LDAP changes
# Format changes for Windows Integrated LDAP

on:
  push:
    branches: [feature/exchange-legacy-ldap]
    paths:
      - '.github/workflows/ldap-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/exchange-legacy-ldap
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/
          if ! git diff --cached --quiet; then
            git commit -m "style(ldap): rustfmt Windows integrated mode"
            git push origin HEAD:feature/exchange-legacy-ldap
          fi
