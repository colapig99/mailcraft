name: Legacy LDAP compile and tests

on:
  push:
    branches: [feature/exchange-legacy-ldap]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ldap-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check net and engine
        run: cargo check --locked -p mailcraft-net -p mailcraft-engine
      - name: Check desktop UI crate
        run: cargo check --locked -p mailcraft-ui-egui
      - name: Clippy on changed Rust crates
        run: cargo clippy --locked -p mailcraft-net -p mailcraft-engine -p mailcraft-ui-egui -- -D warnings
      - name: Run LDAP and directory unit tests
        run: |
          cargo test --locked -p mailcraft-net ldap
          cargo test --locked -p mailcraft-engine directory
          cargo test --locked -p mailcraft-ui-egui i18n::tests::every_interface_string_is_translated

  windows-ldap-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - name: Parse Windows PowerShell LDAP helper
        shell: powershell
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "crates/net/src/ldap_windows.ps1").Path, [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List | Out-String | Write-Error; exit 1 }
      - name: Check helper process IPC and safe errors
        shell: pwsh
        run: |
          $script = Get-Content crates/net/src/ldap_windows.ps1 -Raw
          $invalid = '{"host":"","base_dn":"","filter":"(mail=*)","port":389,"limit":5,"schema":"ad"}'
          # Use the same stdin/stdout/stderr process contract as Rust, rather
          # than a PowerShell pipeline (PowerShell 7 may throw for exit code 2).
          $start = [System.Diagnostics.ProcessStartInfo]::new("powershell.exe")
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          foreach ($arg in @("-NoProfile","-NonInteractive","-Command",$script)) {
            [void]$start.ArgumentList.Add($arg)
          }
          $proc = [System.Diagnostics.Process]::Start($start)
          $proc.StandardInput.Write($invalid)
          $proc.StandardInput.Close()
          $stdout = $proc.StandardOutput.ReadToEnd()
          $stderr = $proc.StandardError.ReadToEnd()
          $proc.WaitForExit()
          Write-Host ("Helper exit code: " + $proc.ExitCode)
          Write-Host ("Helper category: " + (($stderr -split "[`r`n]" | Where-Object { $_ -match '^LDAP_HELPER_ERROR:' }) -join ","))
          if ($proc.ExitCode -ne 2 -or $stderr -notmatch 'LDAP_HELPER_ERROR:HelperRuntime') {
            throw "Bundled Windows LDAP helper JSON stdin/error protocol failed."
          }
      - name: Check Windows native LDAP integration
        run: cargo check --locked -p mailcraft-net -p mailcraft-engine -p mailcraft-ui-egui
      - name: Windows LDAP clippy
        run: cargo clippy --locked -p mailcraft-net -p mailcraft-engine -p mailcraft-ui-egui -- -D warnings
      - name: Windows integrated configuration tests
        run: cargo test --locked -p mailcraft-engine windows_integrated_ldap
